apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - deployment.yaml
  - sealed-secret.yaml
configMapGenerator:
  - name: caddy-gateway-sync
    files:
      - main.py
# kustomize ne réécrit pas la référence ConfigMap dans les volumes du Deployment :
# nom sans suffixe de hash (reloader.stakater.com gère le redémarrage sur changement).
generatorOptions:
  disableNameSuffixHash: true
