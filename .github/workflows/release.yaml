name: Release chart

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "tests/**"
      - "Dockerfile"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Read the chart version
        id: chartver
        run: >
          echo "version=$(sed -n 's/^version: //p' charts/caddy-gateway-sync/Chart.yaml)"
          >> "$GITHUB_OUTPUT"

      - name: Lint and template the chart
        run: |
          helm lint charts/caddy-gateway-sync
          helm template test charts/caddy-gateway-sync > /dev/null

      - name: Run the operator unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Fail-closed: an unverifiable check must NOT publish. "not found" is the
      # one acceptable no; every other failure (network, auth) aborts the job.
      - name: Check whether this chart version is already published
        id: guard
        env:
          CHART_OCI: oci://ghcr.io/pemberton-cluster/charts/caddy-gateway-sync
        run: |
          VERSION=$(sed -n 's/^version: //p' charts/caddy-gateway-sync/Chart.yaml)
          if helm show chart "$CHART_OCI" --version "$VERSION" >/dev/null 2>/tmp/helm-show.err; then
            echo "chart version $VERSION is already published - bump Chart.yaml to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qi "not found" /tmp/helm-show.err; then
            echo "cannot verify whether version $VERSION is published:" >&2
            cat /tmp/helm-show.err >&2
            exit 1
          fi

      - name: Log in to ghcr.io for docker
        if: steps.guard.outputs.skip != 'true'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the operator image
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ghcr.io/pemberton-cluster/caddy-gateway-sync/operator:${{ steps.chartver.outputs.version }}

      - name: Package the chart
        if: steps.guard.outputs.skip != 'true'
        run: helm package charts/caddy-gateway-sync --destination .packaged

      - name: Push chart to OCI registry
        if: steps.guard.outputs.skip != 'true'
        run: helm push .packaged/*.tgz oci://ghcr.io/pemberton-cluster/charts

      - name: Publish chart to GitHub Pages (HTTP repo)
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Rebuild the index from the existing published charts, if any.
          git fetch origin gh-pages --depth=1 || true
          mkdir -p .pages
          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            git archive FETCH_HEAD | tar -x -C .pages
          fi
          cp .packaged/*.tgz .pages/
          helm repo index .pages --url https://pemberton-cluster.github.io/caddy-gateway-sync

      - uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        if: steps.guard.outputs.skip != 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .pages
