name: Release chart

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Lint and template the chart
        run: |
          helm lint charts/caddy-gateway-sync
          helm template test charts/caddy-gateway-sync > /dev/null

      - name: Package the chart
        run: helm package charts/caddy-gateway-sync --destination .packaged

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Push chart to OCI registry
        run: helm push .packaged/*.tgz oci://ghcr.io/pemberton-cluster/caddy-gateway-sync

      - name: Publish chart to GitHub Pages (HTTP repo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebuild the index from the existing published charts, if any.
          git fetch origin gh-pages --depth=1 || true
          mkdir -p .pages
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git archive origin/gh-pages | tar -x -C .pages
          fi
          cp .packaged/*.tgz .pages/
          helm repo index .pages --url https://pemberton-cluster.github.io/caddy-gateway-sync
          cd .pages
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -qm "charts: release $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f origin gh-pages
