{{- if .Values.networkPolicy.enabled }}
# Default-deny both ways. The operator only needs: DNS, the Kubernetes API
# server, and the OPNsense API (given by networkPolicy.opnsenseCidr).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "caddy-gateway-sync.fullname" . }}
  labels:
    {{- include "caddy-gateway-sync.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "caddy-gateway-sync.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # DNS resolution (kube-dns / CoreDNS).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # Kubernetes API server (static pod in kube-system on Talos-like clusters).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-apiserver
      ports:
        - { port: 443, protocol: TCP }
    {{- if .Values.networkPolicy.opnsenseCidr }}
    # OPNsense API.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.opnsenseCidr | quote }}
      ports:
        - { port: 8443, protocol: TCP }
    {{- end }}
{{- end }}
