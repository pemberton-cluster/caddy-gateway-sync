{{- if not .Values.opnsense.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caddy-gateway-sync.secretName" . }}
  labels:
    {{- include "caddy-gateway-sync.labels" . | nindent 4 }}
  {{- if .Values.podAnnotations }}
  annotations:
    {{- toYaml .Values.podAnnotations | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  OPNSENSE_URL: {{ .Values.opnsense.url | quote }}
  OPNSENSE_API_KEY: {{ .Values.opnsense.apiKey | quote }}
  OPNSENSE_API_SECRET: {{ .Values.opnsense.apiSecret | quote }}
{{- end }}
