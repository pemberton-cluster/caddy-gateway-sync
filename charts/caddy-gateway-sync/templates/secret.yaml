{{- if not .Values.opnsense.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caddy-gateway-sync.secretName" . }}
  labels:
    {{- include "caddy-gateway-sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  # URL only: API credentials never come from chart values, they live in the
  # user-provided Secret referenced by opnsense.existingSecret.
  OPNSENSE_URL: {{ .Values.opnsense.url | quote }}
{{- end }}
