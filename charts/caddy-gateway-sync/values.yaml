# Default values for caddy-gateway-sync.

# -- Connection to the OPNsense API --------------------------------------------

opnsense:
  # Base URL of the OPNsense API, e.g. https://opnsense.lan:8443
  url: ""
  # Name of a Secret carrying the API connection: keys OPNSENSE_URL (optional),
  # OPNSENSE_API_KEY and OPNSENSE_API_SECRET. The chart never takes credentials
  # from values — create the Secret yourself (SealedSecrets / ExternalSecrets)
  # so nothing sensitive can end up in git.
  existingSecret: ""
  # Verify the OPNsense API TLS certificate: on by default, the API key/secret
  # travel as Basic auth on that connection. To trust a private CA, set
  # caSecret to a Secret holding the firewall CA under the key `ca.crt`.
  # "1" disables verification entirely — explicit opt-out only.
  tlsInsecure: "0"
  # Name of a Secret containing the firewall CA certificate (key `ca.crt`),
  # mounted into the pod and trusted for the OPNsense API connection.
  caSecret: ""

# -- What to watch and where to proxy ------------------------------------------

gateway:
  # Namespace and name of the Gateway whose HTTP listener is observed.
  namespace: gateway-system
  name: public
  # Name of the HTTP listener on that Gateway.
  listener: http

upstream:
  # VIP of the Gateway: Caddy proxies every public hostname to it.
  host: 10.10.16.38
  port: "80"

# -- Reconciler behavior -------------------------------------------------------

# Drift refresh interval in seconds (Caddy cannot emit webhooks).
reconcileInterval: 900
# Ownership marker written in the Caddy entry description.
markerPrefix: "[gitops] httproute:"
# Finalizer added to managed HTTPRoutes.
finalizer: caddy-gateway-sync/httproute
# Log the diff without writing anything (debugging aid).
planOnly: "0"

# -- Workload ------------------------------------------------------------------

image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

# Python dependencies installed at pod start by the init container.
deps:
  kopf: "1.45.2"
  kubernetes: "37.0.1"

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

podAnnotations:
  reloader.stakater.com/auto: "true"

nodeSelector: {}
tolerations: []
affinity: {}

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # The chart always creates the ServiceAccount it needs.
  name: ""
