apiVersion: v1
kind: ServiceAccount
metadata:
  name: caddy-gateway-sync
  namespace: gateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: caddy-gateway-sync
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: caddy-gateway-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: caddy-gateway-sync
subjects:
  - kind: ServiceAccount
    name: caddy-gateway-sync
    namespace: gateway-system
