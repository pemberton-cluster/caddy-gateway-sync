apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-gateway-sync
  namespace: gateway-system
  annotations:
    # redémarre le pod quand le ConfigMap (script) ou le Secret (clé API) change
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # un seul observateur d'événements à la fois (pas de leader election)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: caddy-gateway-sync
  template:
    metadata:
      labels:
        app: caddy-gateway-sync
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: caddy-gateway-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: deps
          image: python:3.12-slim
          command: ["pip", "install", "--no-cache-dir", "--target", "/opt/deps", "kopf==1.45.2", "kubernetes"]
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: deps
              mountPath: /opt/deps
            - name: tmp
              mountPath: /tmp
      containers:
        - name: operator
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PYTHONPATH=/opt/deps
              if [ -z "$OPNSENSE_API_KEY" ] || [ -z "$OPNSENSE_API_SECRET" ]; then
                echo "caddy-gateway-sync: credentials OPNsense absentes (secret caddy-gateway-sync), opérateur en veille."
                sleep infinity
              else
                exec python /app/main.py
              fi
          env:
            # kopf (getpass.getuser) ne résout pas l'uid 65532 sans entrée passwd
            - name: USER
              value: operator
            - name: OPNSENSE_URL
              valueFrom:
                secretKeyRef: { name: caddy-gateway-sync, key: OPNSENSE_URL, optional: true }
            - name: OPNSENSE_API_KEY
              valueFrom:
                secretKeyRef: { name: caddy-gateway-sync, key: OPNSENSE_API_KEY, optional: true }
            - name: OPNSENSE_API_SECRET
              valueFrom:
                secretKeyRef: { name: caddy-gateway-sync, key: OPNSENSE_API_SECRET, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: deps
              mountPath: /opt/deps
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: caddy-gateway-sync
        - name: deps
          emptyDir: {}
        - name: tmp
          emptyDir: {}
